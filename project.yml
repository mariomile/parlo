name: Parlo
options:
  bundleIdPrefix: com.mariomiletta
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ParloKit:
    path: ParloKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Parlo:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ParloKit
        product: ParloCore
      - package: ParloKit
        product: ParloEngines
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Parlo
        CFBundleDisplayName: Parlo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        SUFeedURL: https://github.com/mariomile/parlo/releases/latest/download/appcast.xml
        SUPublicEDKey: eWrB5z9EMnfG9OcP0l7SYoqU6No7Z94dNsJWKK0Yfss=
        SUEnableAutomaticChecks: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Parlo records your voice while you hold the dictation key or record a meeting, and transcribes it on this Mac.
        NSAudioCaptureUsageDescription: Parlo records what your Mac plays during a meeting you start, so the notes include the other people on the call.
        NSSpeechRecognitionUsageDescription: Parlo can use Apple's on-device speech recognition to transcribe your dictation.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Parlo.entitlements
      properties:
        com.apple.security.device.audio-input: true
        # Sparkle is a separate framework; with a self-signed identity there is no Team ID to match it by.
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariomiletta.parlo
        PRODUCT_NAME: Parlo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
