name: Parlo
options:
  bundleIdPrefix: com.mariomiletta
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  ParloKit:
    path: ParloKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Parlo:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: ParloKit
        product: ParloCore
      - package: ParloKit
        product: ParloEngines
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Parlo
        CFBundleDisplayName: Parlo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSMicrophoneUsageDescription: Parlo records your voice while you hold the dictation key, and transcribes it on this Mac.
        NSSpeechRecognitionUsageDescription: Parlo can use Apple's on-device speech recognition to transcribe your dictation.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Parlo.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mariomiletta.parlo
        PRODUCT_NAME: Parlo
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
